---
# Provision a transient demo EC2 instance in Frankfurt (eu-central-1).
#
# Runs on the AWX control node (localhost) against the AWS API using the
# AWS credential AWX injects as AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY.
# This is the job template Concert Workflows launches (via the Automation
# Controller "Job Templates Launch Create" block) as the auto-remediation /
# provisioning action. The debug summary at the end is what Concert collects
# back through the "Jobs Stdout Read" block.
- name: Provision demo EC2 (Concert -> AWX orchestration PoC)
  hosts: localhost
  connection: local
  gather_facts: false

  # These are defaults; any extra_vars passed at launch (e.g. by Concert
  # Workflows) override them, since extra_vars have the highest precedence.
  vars:
    aws_region: eu-central-1
    instance_type: t3.micro
    instance_name: concert-awx-demo
    sg_name: concert-awx-demo-sg
    # Optional inbound SSH CIDR. Empty (default) = no inbound rule at all,
    # which is the safest for a demo that only needs to prove provisioning.
    ssh_cidr: ""
    # Safety net: the instance self-terminates this many minutes after boot,
    # even if the explicit teardown (terminate_ec2.yml) is forgotten, so nothing
    # is ever left billing. Set to 0 to disable.
    auto_terminate_minutes: 60

  module_defaults:
    group/amazon.aws.aws:
      region: "{{ aws_region }}"

  tasks:
    - name: Find the latest Amazon Linux 2023 AMI (x86_64)
      amazon.aws.ec2_ami_info:
        owners: amazon
        filters:
          name: "al2023-ami-2023.*-x86_64"
          state: available
      register: ami_info

    - name: Select the newest matching AMI
      ansible.builtin.set_fact:
        ami_id: "{{ (ami_info.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Ensure the demo security group exists
      amazon.aws.ec2_security_group:
        name: "{{ sg_name }}"
        description: "Concert/AWX demo - transient, safe to delete"
        tags:
          managed_by: concert-awx
        rules: "{{ ([{'proto': 'tcp', 'ports': [22], 'cidr_ip': ssh_cidr}] if (ssh_cidr | length > 0) else []) }}"
        rules_egress:
          - proto: all
            cidr_ip: 0.0.0.0/0
      register: sg

    - name: Launch the t3.micro instance
      amazon.aws.ec2_instance:
        name: "{{ instance_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        security_groups:
          - "{{ sg_name }}"
        tags:
          managed_by: concert-awx
          purpose: orchestration-rfi-demo
        # Safety net: terminate (not just stop) when the OS powers off, and
        # schedule that power-off N minutes after boot via user-data. Guarantees
        # the instance never outlives the demo even if teardown is skipped.
        instance_initiated_shutdown_behavior: "{{ 'terminate' if (auto_terminate_minutes | int) > 0 else 'stop' }}"
        user_data: "{{ ('#!/bin/bash\nshutdown -h +' ~ (auto_terminate_minutes | int)) if (auto_terminate_minutes | int) > 0 else omit }}"
        wait: true
        state: running
      register: ec2

    - name: Summarize result (collected by Concert via Jobs Stdout Read)
      ansible.builtin.debug:
        msg:
          - "PROVISIONED instance_id={{ ec2.instances[0].instance_id }}"
          - "state={{ ec2.instances[0].state.name }}"
          - "type={{ ec2.instances[0].instance_type }}"
          - "ami={{ ami_id }}"
          - "public_ip={{ ec2.instances[0].public_ip_address | default('none') }}"
          - "private_ip={{ ec2.instances[0].private_ip_address | default('none') }}"
          - "region={{ aws_region }}"
          - "auto_terminate_minutes={{ auto_terminate_minutes }}"
